services:
  mc:
    image: itzg/minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "4G"
      TZ: "America/Sao_Paulo"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
    volumes:
      - ./data:/data

  playit:
    profiles:
      - public-tunnel
    image: ghcr.io/playit-cloud/playit-agent:latest
    network_mode: "service:mc"
    environment:
      SECRET_KEY: "${PLAYIT_SECRET_KEY:-}"
    depends_on:
      - mc
    restart: unless-stopped
